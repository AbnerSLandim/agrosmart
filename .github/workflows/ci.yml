
name: AgroSmart - CI DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Analise de qualidade - Ruff
        run: ruff check .

      - name: Analise de seguranca - Bandit
        run: bandit -r . -x ./.venv -ll

      - name: Executar processamento
        run: python processando_dados.py

      - name: Executar automacao
        run: python automacao_dados.py

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t agrosmart:ci .

      - name: Executar container
        run: docker run --rm agrosmart:ci
