<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1b3a1b">AgroSmart — Arquitetura final da solução (Fase 7)</text>

  <!-- faixas -->
  <g font-size="14" font-weight="700" fill="#555" text-anchor="middle">
    <text x="140" y="90">1. FONTES DE DADOS</text>
    <text x="430" y="90">2. INGESTÃO</text>
    <text x="700" y="90">3. PROCESSAMENTO</text>
    <text x="960" y="90">4. AUTOMAÇÃO</text>
  </g>

  <!-- fontes -->
  <g>
    <rect x="30" y="110" width="220" height="130" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="140" y="138" text-anchor="middle" font-size="16" font-weight="700">Nó de sensores (TinkerCad)</text>
    <text x="140" y="162" text-anchor="middle" font-size="13">Arduino Uno</text>
    <text x="140" y="181" text-anchor="middle" font-size="13">Umidade do solo (A0) · TMP36 (A1)</text>
    <text x="140" y="200" text-anchor="middle" font-size="13">LEDs + buzzer: alerta local</text>
    <text x="140" y="224" text-anchor="middle" font-size="12" fill="#2e7d32">agrosmart_sensores.ino</text>

    <rect x="30" y="270" width="220" height="130" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="140" y="298" text-anchor="middle" font-size="16" font-weight="700">Sensores de campo</text>
    <text x="140" y="322" text-anchor="middle" font-size="13">4 talhões · Fazenda Pedralva</text>
    <text x="140" y="341" text-anchor="middle" font-size="13">umidade, temp. do solo, CE,</text>
    <text x="140" y="360" text-anchor="middle" font-size="13">irrigação (dados sintéticos)</text>
    <text x="140" y="384" text-anchor="middle" font-size="12" fill="#2e7d32">leituras_sensores.csv</text>

    <rect x="30" y="430" width="220" height="100" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="140" y="458" text-anchor="middle" font-size="16" font-weight="700">Estação meteorológica</text>
    <text x="140" y="482" text-anchor="middle" font-size="13">contexto; fora do pipeline atual</text>
    <text x="140" y="514" text-anchor="middle" font-size="12" fill="#2e7d32">clima_estacao.csv</text>
  </g>

  <!-- ingestão -->
  <rect x="320" y="110" width="220" height="130" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="430" y="138" text-anchor="middle" font-size="16" font-weight="700">Ingestão serial</text>
  <text x="430" y="162" text-anchor="middle" font-size="13">Monitor Serial → linhas CSV</text>
  <text x="430" y="181" text-anchor="middle" font-size="13">converte p/ o formato de campo</text>
  <text x="430" y="200" text-anchor="middle" font-size="13">data/hora sintética (bancada)</text>
  <text x="430" y="224" text-anchor="middle" font-size="12" fill="#1565c0">ingestao_tinkercad.py</text>

  <rect x="320" y="270" width="220" height="130" rx="10" fill="#fafafa" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="430" y="298" text-anchor="middle" font-size="16" font-weight="700">Camada bruta</text>
  <text x="430" y="322" text-anchor="middle" font-size="13">dados/brutos/</text>
  <text x="430" y="341" text-anchor="middle" font-size="13">dado como chegou,</text>
  <text x="430" y="360" text-anchor="middle" font-size="13">inclusive com defeitos</text>

  <!-- processamento -->
  <rect x="590" y="190" width="220" height="210" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="700" y="218" text-anchor="middle" font-size="16" font-weight="700">Processamento</text>
  <text x="700" y="244" text-anchor="middle" font-size="13">remove duplicatas</text>
  <text x="700" y="263" text-anchor="middle" font-size="13">descarta valor impossível</text>
  <text x="700" y="282" text-anchor="middle" font-size="13">(umidade fora de 0–100%)</text>
  <text x="700" y="301" text-anchor="middle" font-size="13">descarta sensor sem medição</text>
  <text x="700" y="320" text-anchor="middle" font-size="13">converte tipos, data e hora</text>
  <text x="700" y="339" text-anchor="middle" font-size="13">classifica a umidade</text>
  <text x="700" y="363" text-anchor="middle" font-size="12" fill="#1565c0">processamento.py</text>
  <text x="700" y="382" text-anchor="middle" font-size="11" fill="#1565c0">→ dataset_processado_agrosmart.csv</text>

  <!-- automação -->
  <rect x="860" y="110" width="210" height="290" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="965" y="138" text-anchor="middle" font-size="16" font-weight="700">Motor de regras</text>
  <text x="965" y="164" text-anchor="middle" font-size="13">Alto: umidade &lt; 18%</text>
  <text x="965" y="183" text-anchor="middle" font-size="13">ou temp. ≥ 35 °C</text>
  <text x="965" y="207" text-anchor="middle" font-size="13">Moderado: umidade &lt; 22%</text>
  <text x="965" y="226" text-anchor="middle" font-size="13">ou temp. ≥ 30 °C</text>
  <text x="965" y="254" text-anchor="middle" font-size="13">gera: nível de risco,</text>
  <text x="965" y="273" text-anchor="middle" font-size="13">tipo de alerta, recomendação</text>
  <text x="965" y="292" text-anchor="middle" font-size="13">e ação proposta no CSV</text>
  <text x="965" y="316" text-anchor="middle" font-size="13">(acionar irrigação /</text>
  <text x="965" y="335" text-anchor="middle" font-size="13">notificar produtor)</text>
  <text x="965" y="363" text-anchor="middle" font-size="12" fill="#e65100">automacao.py</text>
  <text x="965" y="382" text-anchor="middle" font-size="12" fill="#e65100">+ resumo e insights</text>

  <!-- visualização -->
  <text x="845" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#555">5. VISUALIZAÇÃO</text>
  <rect x="740" y="455" width="430" height="120" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="955" y="483" text-anchor="middle" font-size="16" font-weight="700">Dashboard analítico</text>
  <text x="955" y="507" text-anchor="middle" font-size="13">indicadores · evolução no tempo por talhão</text>
  <text x="955" y="526" text-anchor="middle" font-size="13">alertas e recomendações · insights automáticos</text>
  <text x="955" y="556" text-anchor="middle" font-size="12" fill="#6a1b9a">gerar_dashboard.py → agrosmart_dashboard.html (refeito a cada execução)</text>

  <!-- setas -->
  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#seta)">
    <path d="M250,175 L318,175"/>
    <path d="M430,240 L430,268"/>
    <path d="M250,335 L318,335"/>
    <path d="M540,335 L588,335"/>
    <path d="M810,295 L858,295"/>
    <path d="M965,400 L965,453"/>
  </g>
  <text x="140" y="560" text-anchor="middle" font-size="12" fill="#666">Orquestração: pipeline.py (manual)</text>
  <text x="210" y="578" text-anchor="middle" font-size="12" fill="#666">ou executor monitorado (faixa 6, abaixo)</text>
  

  <!-- 6. execução monitorada e 7. CI/CD -->
  <text x="310" y="620" text-anchor="middle" font-size="14" font-weight="700" fill="#555">6. EXECUÇÃO E MONITORAMENTO</text>
  <text x="890" y="620" text-anchor="middle" font-size="14" font-weight="700" fill="#555">7. CI/CD DEVSECOPS</text>
  <rect x="30" y="632" width="560" height="104" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
  <text x="310" y="658" text-anchor="middle" font-size="16" font-weight="700">Executor monitorado</text>
  <text x="310" y="680" text-anchor="middle" font-size="13">roda as 4 etapas em processos separados · 1 ciclo, N ciclos ou contínuo</text>
  <text x="310" y="698" text-anchor="middle" font-size="13">logs, eventos.jsonl, status.json, histórico CSV e painel status.html</text>
  <text x="310" y="716" text-anchor="middle" font-size="13">6 verificações de saúde + 1 informativa · saída 0 (saudável) ou 1 (alerta)</text>
  <text x="310" y="731" text-anchor="middle" font-size="11" fill="#00695c">monitoramento/executor.py</text>
  <rect x="640" y="632" width="530" height="104" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="905" y="658" text-anchor="middle" font-size="16" font-weight="700">GitHub Actions + Docker</text>
  <text x="905" y="680" text-anchor="middle" font-size="13">Ruff (qualidade) · Bandit (segurança) · executor · testes</text>
  <text x="905" y="698" text-anchor="middle" font-size="13">publica logs e status como artefato · docker build e docker run</text>
  <text x="905" y="716" text-anchor="middle" font-size="13">container sem privilégios de administrador</text>
  <text x="905" y="731" text-anchor="middle" font-size="11" fill="#ad1457">.github/workflows/ci.yml · Dockerfile</text>
  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#seta)">
    <path d="M638,684 L592,684"/>
  </g>
  <path d="M110,630 L110,588" stroke="#00695c" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#seta)"/>
  <text x="120" y="610" font-size="12" fill="#00695c">supervisiona</text>
  <text x="600" y="764" text-anchor="middle" font-size="12" fill="#888">Campo sintético; TinkerCad simulado; MQTT é exemplo; ações no CSV não comandam irrigação real; monitoramento em lote, sem notificações externas.</text>
</svg>
